name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    uses: sublimelsp/lsp_smoke_test/.github/workflows/smoke-test.yml@v1
    # Provides the Prisma syntax, which Sublime Text doesn't include.
    with:
      extra-packages: |
        Prisma
